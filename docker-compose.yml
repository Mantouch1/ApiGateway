services:
  api-gateway:
    build: .
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:4203,http://localhost:4204,http://localhost:4205,http://localhost:58020}
      IDENTITY_SERVICE_URL: http://identity-service:8082
      TENDERFLOW_SERVICE_URL: http://tenderflow:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      DOCUMENT_SERVICE_URL: http://document-service:8085
      REPORT_SERVICE_URL: http://reporting-service:8086
      SCHEDULER_SERVICE_URL: http://scheduler-service:8087
      SEARCH_SERVICE_URL: http://search-service:8088
    networks:
      - platform-net      # the gateway has no database: it only routes requests

networks:
  platform-net:
    external: true        # create once: docker network create platform-net
