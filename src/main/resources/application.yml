spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # a service that also adds CORS headers must not make them appear twice (browsers reject that)
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          httpclient:
            connect-timeout: 2000
            response-timeout: 30s
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:4203,http://localhost:4204,http://localhost:4205,http://localhost:58020}
                allowedMethods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowedHeaders: "*"
                exposedHeaders: X-Request-Id
                maxAge: 3600
          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/auth/**,/api/accounts/**,/api/roles/**,/api/permissions/**,/api/audit-logs/**
            - id: tenderflow
              uri: ${TENDERFLOW_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/tenders/**,/api/documents/**,/api/statuses/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/notifications/**
            - id: document-service
              uri: ${DOCUMENT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/files/**
            - id: reporting-service
              uri: ${REPORT_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/events/**,/api/reports/**
            - id: scheduler-service
              uri: ${SCHEDULER_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/jobs/**
            - id: search-service
              uri: ${SEARCH_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/search/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
